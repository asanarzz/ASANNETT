<script>
/* ===== Storage (IndexedDB) ===== */
const S=['shop','inv','exp','clean','meal'];let db,D={},tab='home',SG=[],cookSel=null;
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('dastyar-khane',1);r.onupgradeneeded=()=>S.forEach(s=>r.result.createObjectStore(s,{keyPath:'id',autoIncrement:true}));r.onsuccess=()=>{db=r.result;ok()};r.onerror=no});
const st=(s,m)=>db.transaction(s,m).objectStore(s);
const rq=r=>new Promise(ok=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ok()});
const put=(s,o)=>rq(st(s,'readwrite').put(o)),del=(s,id)=>rq(st(s,'readwrite').delete(id));
const load=async()=>{for(const s of S)D[s]=(await rq(st(s,'readonly').getAll()))||[];D.clean.forEach(b=>{if(b.s){b.pm=b.pm||Array.from({length:b.pc||0},(_,i)=>i);b.pc=b.pm.length}})};
const cfg=()=>{try{return JSON.parse(localStorage.getItem('cfg'))||{}}catch(e){return{}}};
const setCfg=o=>{try{localStorage.setItem('cfg',JSON.stringify({...cfg(),...o}))}catch(e){}};
/* ===== Helpers ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n||0).toLocaleString('fa-IR');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),days=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)};
const norm=s=>String(s).replace(/[يى]/g,'ی').replace(/ك/g,'ک').trim();
const digits=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬،]/g,'');
const num=s=>parseFloat(digits(s))||0;
const JF=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric'});
const jm=d=>{const p=JF.formatToParts(new Date(d+'T12:00:00'));return[+p.find(x=>x.type==='year'||x.type==='relatedYear').value,+p.find(x=>x.type==='month').value]};
const monthExp=(off=0)=>{let[y,m]=jm(iso(new Date()));m-=off;while(m<1){m+=12;y--}return D.exp.filter(e=>{const a=jm(e.date);return a[0]===y&&a[1]===m})};
const sum=a=>a.reduce((t,e)=>t+(+e.amount||0),0);

cal(){const[ty,tm,td]=jd3(iso(new Date()));if(!CY){CY=ty;CM=tm}
 const E=calEv(CY,CM),[g,gm,gd]=j2g(CY,CM,1),w=(new Date(g,gm-1,gd).getDay()+1)%7,cells=[...Array(w).fill(0),...Array.from({length:dim(CM)},(_,i)=>i+1)];
 return`<button data-tab="more">→ بازگشت</button><h1>📅 تقویم</h1><div class="add" style="justify-content:space-between;align-items:center"><button data-cm="1" aria-label="ماه بعد">←</button><b>${MN[CM-1]} ${CY.toLocaleString('fa-IR',{useGrouping:false})}</b><button data-cm="-1" aria-label="ماه قبل">→</button></div><div class="card" style="padding:8px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">${['ش','ی','د','س','چ','پ','ج'].map(x=>`<span class="mu">${x}</span>`).join('')}${cells.map(d=>d?`<button data-cd="${d}" style="min-width:0;padding:0;min-height:46px;line-height:1.2;background:${d===CD?'var(--ac)':'var(--bg)'};color:${d===CD?'#fff':'var(--tx)'};border:${CY===ty&&CM===tm&&d===td?'2px solid var(--ac)':'0'}">${fa(d)}${E[d]?'<br><span style="font-size:10px">●</span>':''}</button>`:'<span></span>').join('')}</div></div>${CD?`<div class="card"><h2>${fa(CD)} ${MN[CM-1]}</h2>${(E[CD]||[]).map(t=>`<div class="row"><span class="n">${esc(t)}</span></div>`).join('')||empty('رویدادی ثبت نشده.')}</div>`:''}<div class="mu">● یعنی آن روز قبض، قسط، اجاره، مناسبت یا هزینه دارد.</div>`},

 <div class="card"><h2>ظاهر</h2><div class="add"><button data-th="light">روشن</button><button data-th="dark">تیره</button><button data-th="">سیستم</button></div></div>
 <div class="card"><h2>داده‌ها</h2><div class="mu">همه اطلاعات فقط روی همین دستگاه ذخیره می‌شود.</div>${GUIDE()}<div class="add" style="margin-top:8px"><button class="p" data-do="shareBackup">☁️ پشتیبان در گوگل درایو</button><button class="p" data-do="import">☁️ بازیابی از گوگل درایو</button><button data-do="install">📲 نصب برنامه</button><button data-do="encExport">پشتیبان‌گیری (متن)</button><button data-do="encImport">بازیابی از متن</button><input type="file" id="fi" accept=".txt,.json,text/plain" hidden></div><div class="add" style="margin-top:8px"><button class="d" data-do="wipe">پاک کردن همه اطلاعات</button></div></div>`}};
const TABS=[['home','🏠','خانه'],['shop','🛒','خرید'],['cook','🍳','غذا'],['inv','📦','موجودی'],['exp','💰','هزینه'],['bill','🧾','قبض'],['more','⚙️','بیشتر']];
function render(){document.getElementById('nav').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'on':''}"><b>${t[1]}</b>${t[2]}</button>`).join('');const bm=document.getElementById('bm'),t0=bm?bm.scrollTop:0;document.getElementById('v').innerHTML=V[tab]();const nb=document.getElementById('bm');if(nb)nb.scrollTop=t0;if(tab==='cook'&&!RD)updCook();if(BTM&&tab==='more')document.getElementById('v').insertAdjacentHTML('beforeend',btModal())}
const refresh=async()=>{await load();render()};

const val=id=>(document.getElementById(id)?.value||'').trim();
const DO={
 async shop(){await addShop(val('a1'),num(val('a2')))},
 async inv(){const name=val('a1');if(!name)return;const ex=D.inv.find(i=>norm(i.name)===norm(name));await put('inv',{...(ex||{}),name,qty:num(val('a2')),unit:val('a3'),min:'',exp:jval()||ex?.exp||''});await refresh()},
 async exp(){await addExp(val('a1'),num(val('a2')),val('a3'))},
 async bill(){const k=val('a3'),t=val('a1'),a=num(val('a2'));if(!t||!(a>0))return toast('عنوان و مبلغ را وارد کنید');
 if(k==='قبض'){const d=jval();if(!d)return toast('تاریخ سررسید را انتخاب کنید');await put('clean',{title:t,amount:a,kind:k,due:d,paid:false})}
 else{const g=q=>[+val(q+'1'),+val(q+'2'),+val(q+'3')],S=g('s'),E=g('t');if(!S[0]||!E[0])return toast('تاریخ شروع و پایان را انتخاب کنید');const n=(E[0]-S[0])*12+E[1]-S[1]+1;if(n<1)return toast('پایان باید بعد از شروع باشد');await put('clean',{title:t,amount:a,kind:k,s:S,e:E,n,pc:0})}
 await refresh()},
 async planShop(){const h=have(),need=new Set();D.meal.filter(m=>String(m.date).startsWith('plan-')).forEach(m=>{const r=RECIPES.find(x=>x.n===m.name);r&&r.I.forEach(x=>{if(!x.p&&!h.has(norm(x.n)))need.add(x.n)})});let c=0;for(const n of need)if(!D.shop.some(x=>norm(x.name)===norm(n)&&!x.done)){await put('shop',{name:n,price:0,done:false});c++}await refresh();toast(c?fa(c)+' قلم به خرید اضافه شد':'چیزی کم نیست')},
 async occ(){const t=val('a1');if(!t)return toast('عنوان را وارد کنید');await put('meal',{k:'occ',title:t,jm:val('e2'),jd:val('e3')});await refresh()},
 async note(){const t=val('a1');if(!t)return;await put('meal',{k:'note',text:t,at:today()});await refresh()},
 async mem(){const n=val('a1');if(!n)return toast('نام را وارد کنید');await put('meal',{k:'mem',name:n,role:val('a3'),age:num(val('a2'))||''});await refresh()},
 encExport(){BTM='out';BT=JSON.stringify(snap());render()},
 encImport(){BTM='in';BT='';render()},
 async btRestore(){try{const o=JSON.parse(document.getElementById('bt').value);if(!S.every(k=>Array.isArray(o[k])))throw 0;for(const k of S){await rq(st(k,'readwrite').clear());for(const x of o[k])await put(k,x)}setCfg(o.cfg||{});BTM='';await refresh();toast('بازیابی شد')}catch(e){toast('متن پشتیبان معتبر نیست')}},
 btCopy(){const t=document.getElementById('bt');setCfg({lastBackup:today()});t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand('copy')}catch(e){}toast('کپی شد')},
 btClose(){BTM='';render()},
 install(){if(window._ip){window._ip.prompt()}else toast('از منوی مرورگر گزینهٔ «Install app» یا «Add to Home screen» را بزنید')},
 async shareBackup(){const j=JSON.stringify(snap()),f=new File([j],'dastyar-khane-backup-'+today()+'.txt',{type:'text/plain'});
 if(navigator.share){try{await navigator.share({files:[f],title:'پشتیبان دستیار خانه'});setCfg({lastBackup:today()});await refresh();toast('پشتیبان ارسال شد');return}catch(e){if(e.name==='AbortError')return}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setCfg({lastBackup:today()});await refresh();toast('اشتراک مستقیم در این مرورگر ممکن نبود؛ فایل در پوشهٔ Download ذخیره شد')}
 catch(e){BTM='out';BT=j;render();toast('ذخیرهٔ فایل ممکن نشد؛ متن را کپی کنید')}},
 async moveInv(){for(const x of D.shop.filter(x=>x.done)){const ex=D.inv.find(i=>norm(i.name)===norm(x.name));await put('inv',ex?{...ex,qty:(+ex.qty||0)+1}:{name:x.name,qty:1,min:'',exp:''});if(x.price>0)await put('exp',{title:x.name,amount:+x.price,cat:'غذا',date:today()});await del('shop',x.id)}await refresh();toast('به موجودی منتقل شد')},
 async saveCfg(){setCfg({name:val('nm'),budget:num(val('bd'))});await refresh();toast('ذخیره شد')},
 async export(){const o={v:1,at:new Date().toISOString(),cfg:cfg()};S.forEach(s=>o[s]=D[s]);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='dastyar-khane-backup.json';a.click();toast('اگر دانلود شروع نشد، این صفحه اجازه دانلود ندارد')},
 import(){document.getElementById('fi').click()},
 async wipe(){if(!confirm('همه اطلاعات پاک می‌شود. ادامه می‌دهید؟'))return;if(prompt('برای تأیید نهایی بنویسید: پاک')!=='پاک')return;for(const s of S)await rq(st(s,'readwrite').clear());try{localStorage.removeItem('cfg')}catch(e){}await refresh();toast('پاک شد')}};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab){tab=d.tab;RD=null;cookSel=null;render();scrollTo(0,0)}
 else if(d.rc){RD=d.rc;tab='cook';render();scrollTo(0,0)}
 else if(d.back){RD=null;render()}
 else if(d.pay)await payBill(d.pay);
 else if(d.bd){BD=+d.bd;render()}
 else if(d.pm){const[id,i]=d.pm.split(':');await payMonth(D.clean.find(x=>x.id==id),+i)}
 else if(d.cm){CM+=+d.cm;if(CM>12){CM=1;CY++}if(CM<1){CM=12;CY--}CD=0;render()}
 else if(d.cd){CD=+d.cd;render()}
 else if(d.bdx){BD=null;render()}
 else if(d.unpay){const b=D.clean.find(x=>x.id==d.unpay);b.pc=Math.max(0,b.pc-1);await put('clean',b);await refresh()}
 else if(d.cat){cc=d.cat;cq='';updCook()}
 else if(d.do)await DO[d.do]();
 else if(d.sg!==undefined)await SG[d.sg].a();
 else if(d.tg){const x=D.shop.find(i=>i.id==d.tg);x.done=!x.done;await put('shop',x);await refresh()}
 else if(d.rm){const[s,id]=d.rm.split(':');if(s==='exp'&&!confirm('این هزینه حذف شود؟'))return;await del(s,+id);await refresh()}
 else if(d.q){const[id,k]=d.q.split(':'),i=D.inv.find(x=>x.id==id);i.qty=Math.max(0,(+i.qty||0)+ +k);await put('inv',i);await refresh()}
 else if(d.ck){const k=norm(d.ck);cookSel.has(k)?cookSel.delete(k):cookSel.add(k);updCook()}
 else if(d.meal){await setMeal(d.meal,d.slot);toast('در برنامهٔ امروز ثبت شد');tab='home';RD=null;render()}
 else if(d.miss){for(const m of d.miss.split('|'))await addShop(m);}
 else if(d.delmeal){await del('meal',+d.delmeal);await refresh()}
 else if('th' in d){try{d.th?localStorage.setItem('th',d.th):localStorage.removeItem('th')}catch(e){}theme()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='cmd'){command(e.target.value);e.target.value=''}else{const f=e.target.closest('[data-form]');if(f)f.querySelector('[data-do]').click()}});

 if(!confirm('بازیابی: '+S.map(s=>s+' '+o[s].length).join('، ')+'\nاطلاعات فعلی جایگزین می‌شود. ادامه؟'))return;
 for(const s of S){await rq(st(s,'readwrite').clear());for(const x of o[s])await put(s,x)}setCfg(o.cfg||{});await refresh();toast('بازیابی شد')}catch(x){toast('فایل پشتیبان معتبر نیست')}});

</script><script>(function(){const show=m=>{const v=document.getElementById('v'),n=document.getElementById('nav');if(v&&n&&!n.innerHTML)v.innerHTML='<div style="padding:16px;line-height:1.9"><h2>مشکل در بارگذاری</h2><p>اطلاعات شما پاک نشده و روی همین گوشی است.</p><p style="direction:ltr;font-size:12px;color:#b3372f">'+String(m).replace(/</g,'&lt;')+'</p><button onclick="rs()" style="min-height:44px;padding:0 16px;border:0;border-radius:10px;background:#1f7a6d;color:#fff;font:inherit">پاک کردن کش برنامه و تلاش دوباره</button></div>'};
