<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کافی‌نت آسان‌نت | قیمت لحظه‌ای</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(160deg, #eafff0 0%, #c8f7d8 45%, #9be8b8 100%);
    color: #123322;
    margin: 0;
    padding: 20px 14px;
    min-height: 100vh;
  }
  .header {
    text-align: center;
    margin-bottom: 18px;
  }
  .logo {
    font-size: 30px;
    font-weight: 800;
    color: #0b6e3d;
    text-shadow: 0 2px 6px rgba(11,110,61,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .subtitle {
    font-size: 14px;
    color: #2e6b45;
    margin-top: 4px;
    font-weight: 400;
  }
  .channel {
    margin-top: 10px;
  }
  .channel a {
    display: inline-block;
    background: #ffffff;
    color: #0b6e3d;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 30px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0 14px;
    flex-wrap: wrap;
  }
  .tab {
    background: rgba(255,255,255,0.6);
    color: #0b6e3d;
    border: none;
    padding: 12px 22px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .tab.active {
    background: linear-gradient(135deg, #1fae5e, #0b6e3d);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(11,110,61,0.35);
  }
  .frame-wrap {
    background: #fff;
    border-radius: 22px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(11,110,61,0.18);
  }
  iframe {
    width: 100%;
    height: 72vh;
    border: none;
    border-radius: 16px;
    display: block;
  }
  .footer {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: #2e6b45;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">☕ کافی‌نت آسان‌نت</div>
    <div class="subtitle">قیمت لحظه‌ای بازار</div>
    <div class="channel"><a href="https://eitaa.com/ASANNETT" target="_blank">📢 کانال ایتا: eitaa.com/ASANNETT</a></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('currency', this)">💵 ارز</button>
    <button class="tab" onclick="showTab('gold', this)">🪙 طلا و سکه</button>
    <button class="tab" onclick="showTab('crypto', this)">₿ ارز دیجیتال</button>
  </div>

  <div class="frame-wrap">
    <iframe id="priceFrame" src="https://alanchand.com/currencies-price"></iframe>
  </div>

  <div class="footer">بروزرسانی خودکار و لحظه‌ای</div>

<script>
const urls = {
  currency: "https://alanchand.com/currencies-price",
  gold: "https://alanchand.com/gold-price",
  crypto: "https://alanchand.com/crypto-price"
};
function showTab(key, el) {
  document.getElementById('priceFrame').src = urls[key];
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
