name: scrape-prices
on:
  schedule: [{cron: '30 4 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scraper/scrape.mjs
      - run: |
          git config user.name "price-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/scraped.json; git diff --cached --quiet || git commit -m "update prices"; git push
