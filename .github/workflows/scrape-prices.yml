name: scrape-prices
on:
  schedule: [{cron: '30 4 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scrape-prices, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: fetch prices
        working-directory: nabze-bazar
        run: node scraper/scrape.mjs
      - name: commit result
        run: |
          git config user.name "price-bot"; git config user.email "bot@users.noreply.github.com"
          git add nabze-bazar/data/scraped.json
          git diff --cached --quiet || { git commit -m "update nabze-bazar prices"; git pull --rebase; git push; }
