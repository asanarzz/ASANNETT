name: update-car-prices

on:
  schedule:
    - cron: '15 */3 * * *'   # هر ۳ ساعت
  workflow_dispatch: {}      # اجرای دستی از تب Actions
  push:
    paths:
      - 'khodro/scripts/scrape_cars.py'
      - '.github/workflows/update-prices.yml'

permissions:
  contents: write

concurrency:
  group: update-car-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: دریافت قیمت‌ها
        working-directory: khodro
        run: python scripts/scrape_cars.py
      - name: ذخیره نتیجه
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add khodro/data/scraped.json
          if git diff --cached --quiet; then
            echo "تغییری نبود"
          else
            git commit -m "update car prices"
            git pull --rebase
            git push
          fi
