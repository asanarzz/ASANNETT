<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماشین حساب فیوچرز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14202e;--mut:#63707f;--line:#d6dce4;--win:#0b8a5a;--loss:#c8372d;--acc:#1f4fd8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161e;--card:#18212c;--ink:#e8edf3;--mut:#93a0ae;--line:#2a3644;--win:#35d08f;--loss:#ff6b5f;--acc:#7ea2ff}}
:root[data-theme="dark"]{--bg:#10161e;--card:#18212c;--ink:#e8edf3;--mut:#93a0ae;--line:#2a3644;--win:#35d08f;--loss:#ff6b5f;--acc:#7ea2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:440px}
h1{font-size:1.25rem;font-weight:800;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 5px}
label:first-child{margin-top:0}
input,select{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;direction:ltr;text-align:left}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;font-weight:600;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer}
.seg button.on.long{background:var(--win);border-color:var(--win);color:#fff}
.seg button.on.short{background:var(--loss);border-color:var(--loss);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#res{margin-top:14px}
.big{font-size:2rem;font-weight:800;direction:ltr;text-align:right}
.pos{color:var(--win)}.neg{color:var(--loss)}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.line span:first-child{color:var(--mut)}.line span:last-child{direction:ltr;font-weight:600}
.wheel{position:relative;height:132px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wheel:before{content:"";position:absolute;left:0;right:0;top:44px;height:44px;border-top:1px solid var(--acc);border-bottom:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);pointer-events:none}
#wl{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:44px 0;direction:ltr}
#wl::-webkit-scrollbar{display:none}
#wl div{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;color:var(--mut);font-weight:600;cursor:pointer}
#wl div.sel{color:var(--ink);font-size:1.2rem;font-weight:800}
select option{background:var(--card);color:var(--ink)}
.lnk{font:inherit;font-size:.82rem;color:var(--acc);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.msg{color:var(--mut);font-size:.9rem;text-align:center;padding:6px 0}
</style>
</head>
<body>
<main>
<h1>ماشین حساب فیوچرز</h1>
<div class="card">
  <label>نوع پوزیشن</label>
  <div class="seg">
    <button id="bL" class="on long" type="button">لانگ (خرید)</button>
    <button id="bS" class="short" type="button">شورت (فروش)</button>
  </div>
  <label for="coin">ارز (۱۰۰ ارز برتر)</label>
  <input id="cq" placeholder="جستجوی ارز، مثلاً ETH" autocomplete="off" style="margin-bottom:8px">
  <select id="coin"></select>
  <div class="msg" style="text-align:right;padding:6px 0 0"><span id="pst"></span> <button type="button" id="rf" class="lnk">دریافت قیمت زنده</button></div>
  <label for="entry">قیمت فعلی / ورود (دلار)</label>
  <input id="entry" inputmode="decimal" placeholder="مثلاً 60000">
  <label for="target">قیمت هدف (دلار)</label>
  <input id="target" inputmode="decimal" placeholder="مثلاً 66000">
  <div class="row">
    <div><label for="amt">مبلغ ورود (USDT)</label><input id="amt" inputmode="decimal" placeholder="مثلاً 100"></div>
    <div><label>اهرم (x)</label><div class="wheel"><div id="wl" tabindex="0" aria-label="اهرم"></div></div></div>
  </div>
</div>
<div id="res" class="card"></div>
</main>
<script>
var side='long',LEV=1,$=function(i){return document.getElementById(i)};
function num(v){v=String(v).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/,/g,'').replace('٫','.');return parseFloat(v)}
function f(n,d){return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function calc(){
  var e=num($('entry').value),t=num($('target').value),a=num($('amt').value),l=LEV;
  var r=$('res');
  if(!(e>0&&t>0&&a>0)){r.innerHTML='<div class="msg">قیمت ورود، قیمت هدف و مبلغ را وارد کنید.</div>';return}
  var mv=(side==='long'?(t-e):(e-t))/e;
  var size=a*l,pnl=size*mv,roi=pnl/a*100,end=a+pnl,c=pnl>=0?'pos':'neg',s=pnl>=0?'+':'−';
  var liq=side==='long'?e*(1-1/l):e*(1+1/l);
  var h='<div class="msg">'+(pnl>=0?'سود':'زیان')+' '+coin()+' '+(side==='long'?'لانگ':'شورت')+' در قیمت هدف</div>'
   +'<div class="big '+c+'">'+s+'$'+f(Math.abs(pnl),2)+'</div>'
   +'<div class="big '+c+'" style="font-size:1.4rem">'+s+f(Math.abs(roi),2)+'٪</div>'
   +'<div class="line"><span>تغییر قیمت</span><span>'+(mv>=0?'+':'−')+f(Math.abs(mv)*100,2)+'٪</span></div>'
   +'<div class="line"><span>اندازه پوزیشن</span><span>$'+f(size,2)+'</span></div>'
   +'<div class="line"><span>موجودی نهایی</span><span>$'+f(Math.max(end,0),2)+'</span></div>';
  if(l>1)h+='<div class="line"><span>قیمت تقریبی لیکوئید</span><span>$'+f(liq,2)+'</span></div>';
  if(end<=0)h+='<div class="msg neg">در این قیمت، سرمایه کامل از بین می‌رود.</div>';
  h+='<div class="msg">کارمزد و فاندینگ محاسبه نشده است.</div>';
  r.innerHTML=h;
}
function setSide(s){side=s;$('bL').className='long'+(s==='long'?' on':'');$('bS').className='short'+(s==='short'?' on':'');calc()}
$('bL').onclick=function(){setSide('long')};$('bS').onclick=function(){setSide('short')};
function fmtIn(el){
  var raw=el.value,pos=el.selectionStart==null?raw.length:el.selectionStart;
  var norm=function(t){return t.replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/٫/g,'.')};
  var keep=function(t){return norm(t).replace(/[^0-9.]/g,'')};
  var before=keep(raw.slice(0,pos)).length;
  var c=keep(raw),i=c.indexOf('.');
  if(i>-1)c=c.slice(0,i+1)+c.slice(i+1).replace(/\./g,'');
  var parts=c.split('.'),ip=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  var out=parts.length>1?ip+'.'+parts[1]:ip;
  el.value=out;
  var n=0,k=0;while(k<out.length&&n<before){if(out[k]!==',')n++;k++}
  try{el.setSelectionRange(k,k)}catch(e){}
}
['entry','target','amt'].forEach(function(i){$(i).addEventListener('input',function(){fmtIn($(i))})});
['entry','target','amt','coin'].forEach(function(i){$(i).addEventListener('input',calc)});
var COINS="BTC ETH XRP BNB SOL DOGE TRX ADA HYPE LINK XLM BCH AVAX SUI LTC HBAR SHIB TON DOT UNI AAVE XMR ENA NEAR PEPE APT ICP ETC ONDO ARB WLD ALGO ATOM POL FIL VET RENDER TAO KAS JUP INJ SEI OP TIA STX FET CRV IMX LDO GRT QNT SAND MANA AXS GALA THETA FLOW EOS XTZ NEO IOTA DASH ZEC COMP MKR SNX RUNE BONK FLOKI WIF PENDLE JASMY CHZ APE EGLD KAVA ZIL ENS 1INCH BAT LRC YFI SUSHI CAKE DYDX GMX BLUR PYTH STRK TRUMP PENGU VIRTUAL AERO FARTCOIN ARKM JTO ORDI ZRO W ETHFI".split(" ");
COINS.sort();
function fillCoins(q){q=(q||'').trim().toUpperCase();var cur=$('coin').value||'BTC',h='';COINS.forEach(function(c){if(!q||c.indexOf(q)>-1)h+='<option value="'+c+'">'+c+'</option>'});$('coin').innerHTML=h||'<option value="">یافت نشد</option>';if(!q&&COINS.indexOf(cur)>-1)$('coin').value=cur;document.querySelector('label[for=coin]').textContent='ارز ('+COINS.length+' ارز)'}
function loadCoins(){
  var BL=',USDT,USDC,USDS,DAI,FDUSD,TUSD,BUSD,USDE,PYUSD,USDD,USD1,USDG,RLUSD,BSC-USD,USDT0,STETH,WSTETH,WBTC,WETH,WEETH,WBETH,CBBTC,CBETH,RETH,WBNB,BTCB,SUSDE,SUSDS,BUIDL,USDF,USDX,';
  var ok=function(b){b=String(b).toUpperCase();return /^[A-Z0-9]{1,12}$/.test(b)&&BL.indexOf(','+b+',')<0};
  var cg=[1,2,3,4].map(function(p){return get('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page='+p,15000).then(function(d){return d.map(function(x){return String(x.symbol).toUpperCase()})}).catch(function(){return []})});
  Promise.all(cg).then(function(r){return [].concat.apply([],r)}).then(function(l){
    if(l.length>=300)return l;
    return get('https://api.coinpaprika.com/v1/tickers?quotes=USD',30000).then(function(d){return d.filter(function(x){return x.rank>0&&x.rank<=1000}).sort(function(a,b){return a.rank-b.rank}).map(function(x){return String(x.symbol).toUpperCase()})});
  }).then(function(l){
    var seen={},out=[];l.forEach(function(b){if(ok(b)&&!seen[b]){seen[b]=1;out.push(b)}});
    if(out.length>=100){COINS=out.sort();fillCoins($('cq').value)}
  }).catch(function(){});
}
var tok=0;
function get(u,ms){var ac=new AbortController(),t=setTimeout(function(){ac.abort()},ms||6000);return fetch(u,{signal:ac.signal}).then(function(r){clearTimeout(t);if(!r.ok)throw 0;return r.json()})}
var SRC=[
 ['Nobitex',function(x){return get('https://api.nobitex.ir/v3/orderbook/'+x+'USDT').then(function(d){return +d.lastTradePrice})},false],
 ['Binance',function(x){return get('https://fapi.binance.com/fapi/v1/ticker/price?symbol='+x+'USDT').then(function(d){return +d.price})},true],
 ['Bybit',function(x){return get('https://api.bybit.com/v5/market/tickers?category=linear&symbol='+x+'USDT').then(function(d){return +d.result.list[0].lastPrice})},true],
 ['OKX',function(x){return get('https://www.okx.com/api/v5/market/ticker?instId='+x+'-USDT-SWAP').then(function(d){return +d.data[0].last})},false],
 ['Gate',function(x){return get('https://api.gateio.ws/api/v4/futures/usdt/tickers?contract='+x+'_USDT').then(function(d){return +d[0].last})},false],
 ['MEXC',function(x){return get('https://contract.mexc.com/api/v1/contract/ticker?symbol='+x+'_USDT').then(function(d){return +d.data.lastPrice})},false]];
function tryOne(src,sym){
  var vars=[[sym,1]];if(src[2]){vars.push(['1000'+sym,1000]);vars.push(['10000'+sym,10000]);vars.push(['1000000'+sym,1000000])}
  return vars.reduce(function(p,v){return p.catch(function(){return src[1](v[0]).then(function(x){if(!(x>0))throw 0;return x/v[1]})})},Promise.reject());
}
function getPrice(){
  var sym=$('coin').value,my=++tok;if(!sym)return;
  $('pst').textContent='در حال دریافت قیمت '+sym+'...';
  SRC.reduce(function(p,src){return p.catch(function(){return tryOne(src,sym).then(function(x){return [x,src[0]]})})},Promise.reject())
   .then(function(r){if(my!==tok)return;var e=$('entry');e.value=String(r[0]);fmtIn(e);$('pst').textContent='قیمت زنده '+sym+' از '+r[1];calc()})
   .catch(function(){if(my!==tok)return;$('pst').textContent='اتصال به صرافی‌ها ناموفق بود. فایل دانلودشده را در مرورگر باز کنید (نه پیش‌نمایش) و در صورت نیاز VPN روشن کنید؛ فعلاً قیمت را دستی بزنید.'});
}
fillCoins('');
loadCoins();
$('cq').addEventListener('input',function(){fillCoins(this.value);calc();getPrice()});
$('coin').addEventListener('change',function(){calc();getPrice()});
$('rf').onclick=getPrice;
function coin(){return ($('coin').value||'').trim().toUpperCase()||'ارز'}
var wl=$('wl'),H=44,items=[];
for(var i=1;i<=100;i++){var d=document.createElement('div');d.textContent=i;d.dataset.v=i;wl.appendChild(d);items.push(d)}
function mark(v){items.forEach(function(d,i){d.className=(i+1===v)?'sel':''})}
wl.addEventListener('scroll',function(){var v=Math.min(100,Math.max(1,Math.round(wl.scrollTop/H)+1));if(v!==LEV){LEV=v;mark(v);calc()}});
wl.addEventListener('click',function(e){var v=+e.target.dataset.v;if(v)wl.scrollTo({top:(v-1)*H,behavior:'smooth'})});
wl.addEventListener('keydown',function(e){var v=LEV;if(e.key==='ArrowUp')v--;else if(e.key==='ArrowDown')v++;else return;e.preventDefault();v=Math.min(100,Math.max(1,v));wl.scrollTo({top:(v-1)*H,behavior:'smooth'})});
mark(1);
calc();
getPrice();
</script>
</body>
</html>
