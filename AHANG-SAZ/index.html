<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1230">
<title>آهنگ ساز آسان نت</title>
<style>
:root{--bg:#0e1230;--cd:#1a1f4a;--tx:#eef0ff;--mt:#9aa3d8;--ac:#7c5cff;--bd:#2d3470}
:root[data-t=l]{--bg:#f3f4ff;--cd:#fff;--tx:#14183a;--mt:#5a6190;--bd:#d6d9f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,Tahoma,sans-serif;padding:max(12px,env(safe-area-inset-top)) 14px 40px;max-width:640px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;font-size:20px;margin-bottom:8px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:linear-gradient(135deg,#7c5cff,#3ea6ff);border:0;border-radius:12px;padding:10px 18px;color:#fff;cursor:pointer}
button[disabled]{opacity:.5}
label{display:block;margin:10px 0 4px;color:var(--mt);font-size:14px}
textarea,select,input:not([type=checkbox]):not([type=range]){width:100%;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;width:35%;background:var(--ac);animation:m 1.2s infinite alternate}
@keyframes m{to{margin-right:65%}}
.er{color:#ff7b7b}small,li{color:var(--mt)}audio{width:100%;margin-top:10px}a{color:#6cb6ff}
.dt{white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--mt)}details{margin-top:12px}summary{color:var(--mt);cursor:pointer}
</style></head><body>
<header><b>🎵 آهنگ ساز آسان نت</b><button id=th aria-label="تغییر پوسته">◐</button></header>
<h2>شعر به آهنگ</h2>
<label>شعر یا ترانه (برچسب‌هایی مثل [verse] و [chorus] مفیدند)</label><textarea id=ly rows=8></textarea>
<label>سبک</label><select id=sy><option value="Persian pop">پاپ ایرانی</option><option value="traditional Persian, santur, tar, daf, tonbak">سنتی ایرانی</option><option value="rap hip-hop">رپ و هیپ‌هاپ</option><option value="rock">راک</option><option value="classical orchestral">کلاسیک</option><option value="electronic">الکترونیک</option><option value="lo-fi">لوفای</option><option value="acoustic">آکوستیک</option><option value="romantic ballad">عاشقانه</option><option value="epic cinematic">حماسی</option><option value="upbeat dance pop">شاد و رقصی</option></select>
<label>حال‌وهوا</label><select id=mo><option value=sad>غمگین</option><option value=happy>شاد</option><option value=calm>آرام</option><option value=energetic>پرانرژی</option><option value=romantic>عاشقانه</option><option value=nostalgic>نوستالژیک</option><option value=epic>حماسی</option><option value=mysterious>رازآلود</option></select>
<label>صدای خواننده</label><select id=vo><option value="male vocal">مرد</option><option value="female vocal">زن</option><option value="mixed choir vocals">گروهی</option></select>
<label>زبان شعر</label><select id=la><option value=fa>فارسی</option><option value=en>انگلیسی</option><option value=tr>ترکی</option><option value=ar>عربی</option></select>
<label>مدت: <span id=dv>60</span> ثانیه (کوتاه‌تر، سهمیهٔ کمتری مصرف می‌کند)</label><input id=du type=range min=30 max=180 step=10 value=60 oninput="dv.textContent=this.value">
<label>سرعت (BPM، اختیاری)</label><input id=bp type=number min=50 max=200 inputmode=numeric>
<label>توضیحات بیشتر (فارسی یا انگلیسی، اختیاری)</label><input id=ex>
<label><input id=ins type=checkbox> بی‌کلام</label>

<p><small id=qt></small></p>
<p><button id=go>ساخت آهنگ</button></p><div id=out></div>


<script>
const KEY='a02957cc402b48458cc2122921a483ec';/* کلید ACE Music را بین دو نقل‌قول بگذارید */
const $=s=>document.querySelector(s),h=(t,p={},...k)=>{const e=Object.assign(document.createElement(t),p);e.append(...k);return e};
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch{return''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const R=document.documentElement;if(ls.get('t'))R.dataset.t=ls.get('t');
$('#th').onclick=()=>{R.dataset.t=R.dataset.t==='l'?'d':'l';ls.set('t',R.dataset.t)};
['ly','ex'].forEach(i=>{$('#'+i).value=ls.get(i);$('#'+i).oninput=()=>ls.set(i,$('#'+i).value)});

const LIMIT=3,OWNER_HASH='55d35922e39bdad2a112e15bd8789e101714d94bdb112830b4c3e478f1c1631b',U=new URLSearchParams(location.search).get('uid')||'device';
const QK=()=>'n:'+U+':'+new Date().toLocaleDateString('en-CA'),isOwner=()=>ls.get('own')==='1',used=()=>+ls.get(QK())||0;
const showQ=()=>{$('#qt').textContent=isOwner()?'حالت مدیر: بدون محدودیت':'امروز '+used()+' از '+LIMIT+' آهنگ استفاده شده'};showQ();
let taps=0,tt;$('header b').onclick=async()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,2000);if(taps<5)return;taps=0;
 const p=prompt('رمز مدیر:');if(!p)return;
 try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p.trim()));
  if([...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')===OWNER_HASH){ls.set('own','1');showQ();alert('حالت مدیر فعال شد.')}else alert('رمز نادرست است.')}
 catch{alert('این مرورگر از این قابلیت پشتیبانی نمی‌کند.')}};
const viaAce0=async(sig,k,tags,ly,dur,lang,ins)=>{
 const H={Authorization:'Bearer '+k,'Content-Type':'application/json'},B='https://api.acemusic.ai';let model='acemusic/acestep-v15-turbo';
 try{const r=await fetch(B+'/v1/models',{headers:H,signal:sig});if(r.ok){const j=await r.json();model=(j.data&&j.data[0]&&j.data[0].id)||model}}catch{}
 const r=await fetch(B+'/v1/chat/completions',{method:'POST',headers:H,signal:sig,body:JSON.stringify({model,stream:false,messages:[{role:'user',content:ins?'<prompt>'+tags+'</prompt>':tags}],lyrics:ins?undefined:ly,use_cot_language:false,audio_config:{duration:dur,vocal_language:lang,instrumental:ins}})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=j.error;throw new Error(String((e&&(e.message||JSON.stringify(e)))||j.detail||'خطا '+r.status))}
 const a=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.audio,u=a&&a[0]&&a[0].audio_url&&a[0].audio_url.url;
 if(!u){const er=new Error('موتور فایل صوتی برنگرداند.');er.detail=JSON.stringify(j).slice(0,900);throw er}
 return {bl:URL.createObjectURL(await(await fetch(u)).blob()),txt:String(j.choices[0].message.content||'')}};
const viaAce=async(...a)=>{const ac=new AbortController();window.ac=ac;const to=setTimeout(()=>ac.abort(),240000);try{return await viaAce0(ac.signal,...a)}finally{clearTimeout(to)}};
$('#go').onclick=async()=>{
 const ins=$('#ins').checked,ly=$('#ly').value.trim(),box=$('#out'),btn=$('#go');
 if(!ins&&!ly)return alert('شعر را وارد کنید یا گزینهٔ «بی‌کلام» را بزنید.');
 if(!isOwner()&&used()>=LIMIT)return alert('سهمیهٔ امروز شما ('+LIMIT+' آهنگ) تمام شد. فردا دوباره امتحان کنید.');
 
 const tags=[$('#sy').value,$('#mo').value+' mood',...(ins?['instrumental']:[$('#vo').value]),$('#bp').value&&$('#bp').value+' BPM',$('#ex').value.trim()].filter(Boolean).join(', ');
 const say=t=>box.replaceChildren(h('div',{className:'bar'},h('i')),h('p',{textContent:t}));
 let tm;btn.disabled=true;say('در حال اتصال به موتور…');
 try{
  const k=KEY||ls.get('ak')||(prompt('کلید ACE Music را وارد کنید (فقط یک بار):')||'').trim();
  if(!k)throw new Error('کلید وارد نشد.');
  if(!KEY)ls.set('ak',k);
  say('در حال ساخت آهنگ… ۰ ثانیه');const t0=Date.now();tm=setInterval(()=>{const p=box.querySelector('p');if(p)p.textContent='در حال ساخت آهنگ… '+Math.round((Date.now()-t0)/1000)+' ثانیه'},1000);
  box.append(h('button',{textContent:'انصراف',onclick:()=>window.ac&&window.ac.abort()}));
  const {bl,txt}=await viaAce(k,tags,ly,+$('#du').value,$('#la').value,ins);
  box.replaceChildren(h('audio',{controls:true,src:bl}),h('a',{href:bl,download:'song.mp3',textContent:'دانلود'}),txt.length>40?h('details',{},h('summary',{textContent:'جزئیات (شعری که موتور استفاده کرد)'}),h('pre',{className:'dt',textContent:txt})):'');ls.set(QK(),String(used()+1));showQ();
 }catch(e){
  const m=e&&e.message?e.message:String(e);
  box.replaceChildren(h('p',{className:'er',textContent:m+(/quota/i.test(m)?' (سهمیهٔ روزانهٔ GPU تمام شده؛ ۲۴ ساعت بعد دوباره امتحان کنید.)':/abort/i.test(m)?' (زمان انتظار تمام شد یا انصراف دادید. سرویس ممکن است شلوغ باشد؛ با مدت کوتاه‌تر و شعر کوتاه‌تر دوباره امتحان کنید.)':/fetch|network/i.test(m)?' (اتصال برقرار نشد؛ شاید اینترنت قطع است یا مرورگر اجازهٔ اتصال به این سرویس را نمی‌دهد.)':'')+' — دوباره تلاش کنید.'}),e&&e.detail?h('pre',{className:'dt',dir:'ltr',textContent:e.detail}):'')}
 clearInterval(tm);btn.disabled=false};
</script></body></html>
