<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرم اطلاعات نوآموز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--b:#0063c1;--bg:#f6f7f9;--c:#fff;--t:#222;--m:#8a8f98;--br:#dcdfe4}
@media(prefers-color-scheme:dark){:root{--bg:#15181c;--c:#1f2329;--t:#eee;--m:#9aa0a8;--br:#3a4048}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.9 Vazirmatn,Tahoma,sans-serif}
.w{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--c);border-radius:14px;padding:18px;border:1px solid var(--br)}
h1{font-size:15px;color:var(--m);text-align:center;margin:4px 0 8px;font-weight:400}
h2{color:var(--b);text-align:center;font-size:19px;margin:6px 0 18px}
.bar{height:6px;background:var(--br);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--b);width:0;transition:.3s}
section{display:none}section.on{display:block}
.f{margin-bottom:20px}.l{font-weight:600}.h{color:var(--m);font-size:14px;margin:2px 0 6px}
.ch{display:inline-flex;align-items:center;gap:8px;margin:4px 0 4px 18px}
.ch input{width:22px;height:22px;accent-color:var(--b)}
input[type=text],input[type=number],select,textarea{width:100%;padding:12px;border:2px solid var(--br);border-radius:12px;background:var(--bg);color:var(--t);font:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b)}
.sw{display:flex;align-items:center;gap:10px}
.sw input{appearance:none;width:46px;height:26px;background:var(--br);border-radius:20px;position:relative;cursor:pointer;margin:0;transition:.2s}
.sw input::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--b)}.sw input:checked::after{right:23px}
.nav{display:flex;flex-direction:column;gap:10px;margin-top:10px}
button{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--b);cursor:pointer}
.nx{background:var(--b);color:#fff}.pv{background:var(--c);color:var(--b)}
button:disabled{opacity:.6}
.f.err{border-right:4px solid #d32f2f;background:rgba(211,47,47,.07);border-radius:8px;padding:6px 10px}
.f.err .l{color:#d32f2f}
.f.err input[type=text],.f.err input[type=number],.f.err select,.f.err textarea{border-color:#d32f2f}
.f.lk{opacity:.4;pointer-events:none}
#er{color:#d32f2f;text-align:center;font-size:14px;display:none;margin:8px 0}
#msg{text-align:center;padding:40px 10px;display:none}
#msg .ok{font-size:64px;line-height:1.2}
.dt{cursor:pointer}
#dpw{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#dp{background:var(--c);border-radius:14px;padding:14px;width:100%;max-width:340px}
.dh{display:flex;gap:8px;margin-bottom:10px}.dh select{flex:1;width:auto;padding:8px}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dg b{font-size:13px;color:var(--m)}
.dg button{padding:8px 0;border:0;background:transparent;color:var(--t);border-radius:8px}
.dg button.t{border:1px solid var(--b)}.dg button.s{background:var(--b);color:#fff}
.df{display:flex;gap:8px;margin-top:10px}.df button{flex:1;background:var(--c);color:var(--b);padding:8px}
</style>
</head>
